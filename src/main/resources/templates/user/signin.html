<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>

<body class="min-h-screen relative overflow-hidden">

<div class="absolute inset-0">
    <img src="/img/back.png"
         alt="기차 배경"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-br from-blue-500/30 to-purple-500/30"></div>
</div>

<div class="relative flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">

        <div class="text-center mb-3 text-white">
            <div class="flex items-center justify-center gap-3 mb-3">
                <i data-lucide="map" class="w-12 h-12"></i>
                <h1 class="text-4xl font-bold">CHECK-IN</h1>
            </div>
            <p class="text-white/90 text-lg">
                전 세계를 여행하는 당신의 이야기
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-5">
            <h2 class="mb-2 text-2xl font-semibold">탑승권 확인</h2>
            <p class="text-sm text-gray-600 mb-3">로그인</p>

            <div  class="space-y-4">
                <div>
                    <label class="text-gray-500 text-sm mb-1 uppercase">Email</label>
                    <input type="email"
                           id="emailInput"
                           name="emailInput"
                           class="w-full h-11 border rounded px-3"
                           placeholder="이메일을 입력하세요"
                           required>
                </div>
                <div class="small text-danger mt-2 ml-2 d-none" id="emailInvalidText">
                    이메일 형식이 올바르지 않습니다.
                </div>

                <div>
                    <label class="text-gray-500 text-sm mb-1 uppercase">Password</label>
                    <input type="password"
                           id="passwordInput"
                           name="passwordInput"
                           class="w-full h-11 border rounded px-3"
                           placeholder="비밀번호를 입력하세요"
                           required>
                </div>

                <button
                        type="submit"
                        class=" w-full h-12 bg-blue-600 text-white rounded hover:bg-blue-700 mt-4"
                        id="signinBtn"
                >
                    탑승하기
                </button>
            </div>

            <div class="mt-3 pt-3 border-t border-gray-200 text-center">
                <div class="flex justify-center gap-[2px] mb-1">
                    <img src="/img/barcode.png">
                </div>
                <p class="text-xs text-gray-400 tracking-widest">
                    TRAVEL-SNS-2024-BOARDING
                </p>
            </div>

            <div class="mt-4 text-center text-sm text-gray-600">
                탑승권이 없으신가요?
                <a href="/user/signup" class="text-blue-600 hover:underline">sign up</a>
            </div>
        </div>

        <div class="mt-4 text-center text-white/80 text-sm flex items-center justify-center gap-2">
            <i data-lucide="plane" class="w-4 h-4"></i>
            세계 곳곳의 여행 이야기를 공유하세요
        </div>

    </div>
</div>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script> lucide.createIcons(); </script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    function isValidEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
    }

    $("#emailInput").on("input",function (){
       let email = $("#emailInput").val();

       $("#emailInvalidText").addClass("d-none");

        if (!isValidEmail(email)) {
            $("#emailInvalidText").removeClass("d-none");
            return;
        }
    });

    $("#signinBtn").on("click",function(){
        let email = $("#emailInput").val();
        let password = $("#passwordInput").val();

        if(email == ""){
            alert("이메일을 입력하세요");
            return;
        }

        if(password == ""){
            alert("비밀번호를 입력하세요");
            return;
        }

        $.ajax({
            type: "post",
            url: "/user/signin-process",
            data: {email: email, password: password},
            success: function (response){
                if(response.result == "success"){
                    location.href = "/home/timeline";
                }else{
                    alert("이메일과 비밀번호를 확인해 주세요.");
                }
            },
            error: function (){
                alert("로그인 에러");
            }
        })
    });
</script>

</body>
</html>
