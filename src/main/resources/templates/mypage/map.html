<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{components/default_head}">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>
<div layout:fragment="content">
    <div id="chartdiv">
        <div class="profile-card-container">

            <div class="boarding-pass ">
                <div class="top-stripe">
                    <img src="/img/top-stripe.png" alt="프로필 머리">
                </div>

                <div class="pass-content">
                    <div class="top-section">
                        <div class="profile-pic-wrapper">
                            <img id="myProfileImg"
                                 th:src="${session.userProfileImg}"
                                 class="profile-pic profile-sty">
                        </div>

                        <div>
                            <button class="edit-btn" id="btnEditProfile">프로필 편집</button>
                            <div class="plane-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="flight-info-row">
                        <div class="airport-code">
                            <span th:text="${session != null and session.userCountryCode != null ? session.userCountryCode : ''}"
                                  class="font-weight-bold"></span>
                        </div>
                        <div class="flight-details">
                            <div class="detail-item">
                                <div class="label">FLIGHT</div>
                                <div class="value" th:text="${postCount}">0</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">GATE</div>
                                <div class="value" th:text="${wishlistCount}">0</div>
                            </div>
                        </div>
                    </div>

                    <h1 class="departure">WHERE TO NEXT?</h1>

                    <p class="airline-name">항공사 이름 :
                        <span th:text="${session != null and session.userNickName != null ? session.userNickName : 'User'}"
                              class="font-weight-bold"></span>
                    </p>

                    <div class="divider"></div>

                    <div class="bottom-section">
                        <div class="user-stats">
                            <div class=" mb-2 flex">
                                <h3 class="profileWordText profileMessege mb-2"
                                    th:text="${session.userProfileWord != null ? '- ' + session.userProfileWord : '-'}">
                                    -
                                </h3>
                            </div>
                            <div class="stat-row mb-4">
                                <span class="stat-label">Following</span>
                                <span class="stat-count"
                                      th:text="${friendCount}">
                                    0
                                </span>
                            </div>

                        </div>
                        <div class="qr-code-wrapper">
                            <div class="qr-mock">
                                <div class="qr-eyes">👀</div>
                                <div class="qr-num">3</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="countryListPanel" class="country-list-panel hidden">

            <div class="country-panel-header">
                <div class="country-panel-title">
                    <i class="bi bi-airplane-fill"></i>
                    <span id="countryPanelName"></span>
                </div>

                <button type="button"
                        id="countryPanelClose"
                        class="country-panel-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div id="countryTicketGrid" class="country-ticket-grid">

                <div class="country-ticket d-none">

                    <div class="ticket-img-wrap">
                        <img class="country-ticket-img">
                        <button type="button"
                                class="country-ticket-menu">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>

                    </div>


                    <div class="ticket-divider">
                        <div class="right-hole"></div>
                        <div class="ticket-hole top"></div>
                        <div class="ticket-hole bottom"></div>
                    </div>

                    <div class="country-ticket-body">

                        <div class="country-ticket-date"></div>

                        <div class="country-ticket-route">
                            <span class="from"></span>
                            <span class="mid">━━✈━━</span>
                            <span class="to"></span>
                        </div>

                    </div>

                </div>

            </div>

        </div>
        <div id="WishListPanel" class="country-list-panel hidden">

            <div class="wish-panel-header">
                <div class="wish-panel-title">
                    <i class="bi bi-heart-fill"></i>
                    <span id="wishPanelName"></span>
                </div>

                <button type="button"
                        id="wishPanelClose"
                        class="country-panel-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div id="wishTicketGrid" class="country-ticket-grid">

                <div class="wish-ticket d-none">

                    <div class="wish-ticket-header">
                        <i class="bi bi-heart-fill wish-ticket-heart"></i>
                        <div class="wish-ticket-city"></div>
                        <button type="button" class="wish-ticket-menu">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>
                    </div>

                    <div class="ticket-divider">
                        <div class="right-hole"></div>
                        <div class="ticket-hole top"></div>
                        <div class="ticket-hole bottom"></div>
                    </div>

                    <div class="wish-ticket-body">
                        <div class="wish-ticket-row">
                            <span class="wish-ticket-label mr-2">PERIOD</span>
                            <span class="wish-ticket-count"></span>
                        </div>
                        <div class="wish-ticket-row">
                            <span class="wish-ticket-label mr-2">DATE</span>
                            <span class="wish-ticket-period"></span>
                        </div>
                        <div class="wish-ticket-memo"></div>
                    </div>

                </div>

            </div>

        </div>

        <div class="modal fade create-choice-modal" id="moreModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body">

                        <button type="button" class="btn-choice edit-post-btn d-none">게시물 수정</button>
                        <button type="button" class="btn-choice delete-post-btn d-none">게시물 삭제</button>

                        <button type="button" class="btn-choice edit-wishlist-btn d-none">위시리스트 수정</button>
                        <button type="button" class="btn-choice delete-wishlist-btn d-none">위시리스트 삭제</button>

                    </div>
                </div>
            </div>
        </div>

    </div>
    <div th:replace="~{mypage/pofile :: profilePanel}"></div>

    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>

        function  openWishPanel(countryCode){
            if (!countryCode) {
                alert("국가 코드 확인");
                return;
            }
            const countryName = countryNameMap[countryCode] || countryCode;
            $("#wishPanelName").text(countryName);

            renderCountryTickets([]);

            $("#countryListPanel").removeClass("show");

            setTimeout(function () {
                $("#countryListPanel").addClass("hidden");
            }, 220);

            setTimeout(function () {
                $("#WishListPanel").removeClass("hidden");

                setTimeout(function () {
                    $("#WishListPanel").addClass("show");
                }, 10);
            }, 230);

            $.ajax({
                url: "/mypage/wishlist/tickets",
                type: "GET",
                data: {countryCode: countryCode},
                dataType: "json",

                success: function (response) {
                    if (response.result == "success") {
                        renderWishTickets(response.data);
                    }else{
                        alert("티켓 조회 실패");
                        renderWishTickets([]);
                    }
                }, error: function () {
                    alert(("티켓 조회 에러"));
                    renderWishTickets([]);
                }

            });

        }

        function renderWishTickets(wishList) {

            const $grid = $("#wishTicketGrid");
            $grid.find(".wish-ticket.generated").remove();
            const $template = $grid.find(".wish-ticket.d-none").first();
            if ($template.length === 0) {
                return;
            }
            $.each(wishList, function (index, wish) {

                const $ticket = $template.clone();

                $ticket.removeClass("d-none").addClass("generated");
                $ticket.attr("data-wishlist-id", wish.id);
                $ticket.find(".wish-ticket-city").text(wish.cityName);
                $ticket.find(".wish-ticket-count").text(wish.period);
                $ticket.find(".wish-ticket-period").text(
                    (wish.startDate ? formatDate(wish.startDate) : "")
                    + (wish.endDate ? " ~ " + formatDate(wish.endDate) : "")
                );

                $ticket.find(".wish-ticket-memo").text(wish.memo ? wish.memo : "메모 없음");

                $grid.append($ticket);
            });
        }
        $(document).on("click", ".wish-ticket-menu", function (event) {
            event.stopPropagation();

            const wishlistId = $(this).closest(".wish-ticket").data("wishlist-id");

            if (!wishlistId) {
                alert("위시리스트 번호가 없습니다.");
                return;
            }

            $(".edit-post-btn").addClass("d-none").removeData("post-id");
            $(".delete-post-btn").addClass("d-none").removeData("post-id");
            $(".edit-wishlist-btn").addClass("d-none").removeData("wishlist-id");
            $(".delete-wishlist-btn").addClass("d-none").removeData("wishlist-id");

            $(".edit-wishlist-btn").removeClass("d-none").data("wishlist-id", wishlistId);
            $(".delete-wishlist-btn").removeClass("d-none").data("wishlist-id", wishlistId);

            $("#moreModal").modal("show");
        });
        function openCountryPanel(countryCode) {

            if (!countryCode) {
                alert("국가 코드 확인");
                return;
            }
            const countryName = countryNameMap[countryCode] || countryCode;
            $("#countryPanelName").text(countryName);

            renderWishTickets([]);

            $("#WishListPanel").removeClass("show");

            setTimeout(function () {
                $("#WishListPanel").addClass("hidden");
            }, 220);

            setTimeout(function () {
                $("#countryListPanel").removeClass("hidden");

                setTimeout(function () {
                    $("#countryListPanel").addClass("show");
                }, 10);
            }, 230);
            $.ajax({
                url: "/mypage/post/tickets",
                type: "GET",
                data: {countryCode: countryCode},
                dataType: "json",

                success: function (response) {
                    if (response.result == "success") {
                        renderCountryTickets(response.data);
                    }else{
                        alert("티켓 조회 실패");
                        renderCountryTickets([]);
                    }
                }, error: function () {
                    alert(("티켓 조회 에러"));
                    renderCountryTickets([]);
                }

            });

        }
        function renderCountryTickets(postList) {

            const $grid = $("#countryTicketGrid");
            $grid.find(".country-ticket.generated").remove();
            const $template = $grid.find(".country-ticket.d-none").first();
            if ($template.length === 0) {
                return;
            }
            $.each(postList, function(index, post) {

                console.log("티켓 생성:", post);

                const $ticket = $template.clone();

                $ticket.removeClass("d-none").addClass("generated");
                $ticket.attr("data-post-id", post.postId);
                $ticket.find(".country-ticket-img").attr("src", post.imageUrl);
                $ticket.find(".country-ticket-date").text(formatDate(post.createdAt));
                $ticket.find(".from").text(post.fromCountryCode);
                $ticket.find(".to").text(post.toCountryCode);

                $grid.append($ticket);
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.getFullYear()
                + "."
                + String(date.getMonth() + 1).padStart(2, "0")
                + "."
                + String(date.getDate()).padStart(2, "0");
        }

        let countryNameMap = {};


        $.ajax({
            url: "/country/list",
            type: "GET",
            dataType: "json",
            success: function (response) {
                $.each(response, function (index,country) {
                    countryNameMap[country.countryCode] = country.countryNameKo;
                });
                initMap();
            },
            error: function () {
                console.error("나라 목록 로딩 실패");
            }
        });

        function initMap() {
            am5.ready(function () {
                var root = am5.Root.new("chartdiv");

                root.setThemes([am5themes_Animated.new(root)]);

                const chart = root.container.children.push(
                    am5map.MapChart.new(root, {
                        panX: "rotateX",
                        panY: "rotateY",
                        boxZoom: "shift",
                        projection: am5map.geoOrthographic(),
                        paddingBottom: 20,
                        paddingTop: 20,
                        paddingLeft: 20,
                        paddingRight: 20

                    })
                )

                const backgroundSeries = chart.series.push(
                    am5map.MapPolygonSeries.new(root, {})
                );

                backgroundSeries.mapPolygons.template.setAll({
                    fill: am5.color(0xE5E5E5),
                    fillOpacity: 0.5,
                    strokeOpacity: 0
                });

                const graticuleSeries = chart.series.push(
                    am5map.GraticuleSeries.new(root, {})
                );

                graticuleSeries.mapLines.template.setAll({
                    stroke: am5.color(0x000000),
                    strokeOpacity: 0.08,
                    strokeWidth: 0.5
                });

                var cont = chart.children.push(
                    am5.Container.new(root, {
                        layout: root.horizontalLayout,
                        x: 20,
                        y: 40
                    })
                );

                cont.children.push(
                    am5.Label.new(root, {
                        centerY: am5.p50,
                        text: "Globe"
                    })
                );
                var switchButton = cont.children.push(
                    am5.Button.new(root, {
                        themeTags: ["switch"],
                        centerY: am5.p50,
                        icon: am5.Circle.new(root, {
                            themeTags: ["icon"]
                        })
                    })
                );
                cont.children.push(
                    am5.Label.new(root, {
                        centerY: am5.p50,
                        text: "Map"
                    })
                );
                switchButton.on("active", function () {
                    if (!switchButton.get("active")) {
                        chart.set(
                            "projection",
                            am5map.geoOrthographic()
                        );
                        chart.set(
                            "panY",
                            "rotateY",
                        );
                        backgroundSeries.mapPolygons.template.set(
                            "fillOpacity",
                            0.1
                        );

                    } else {

                        chart.set(
                            "projection",
                            am5map.geoMercator()
                        );
                        chart.set(
                            "panY",
                            "translateY"
                        );
                        chart.set(
                            "rotationY",
                            0);
                    }
                });

                var polygonSeries = chart.series.push(
                    am5map.MapPolygonSeries.new(root, {
                        geoJSON: am5geodata_worldLow
                    })
                );

                polygonSeries.mapPolygons.template.setAll({
                    fill: am5.color(0x5C85C6),
                    stroke: am5.color(0xffffff),
                    interactive: true,
                });

                polygonSeries.mapPolygons.template.states.create(
                    "hover",
                    {
                        fill: root.interfaceColors.get(
                            "primaryButtonHover"
                        )
                    }
                );
                polygonSeries.mapPolygons.template.events.on(
                  "pointerover",
                  function (event){
                      var dataItem = event.target.dataItem;

                      if(!dataItem){
                          return;
                      }

                      var dataContext = dataItem.dataContext;
                      var countryCode = dataContext.id;
                      var koreaName = countryNameMap[countryCode];

                      if(koreaName){
                          event.target.set("tooltipText",koreaName);
                      }else{
                          event.target.set(
                              "tooltipText",
                              dataContext.name
                          );
                      }
                  }
                );
                polygonSeries.mapPolygons.template.events.on(
                    "click",
                    function (event) {

                        const dataItem = event.target.dataItem;

                        if (!dataItem) {
                            return;
                        }

                        const dataContext = dataItem.dataContext;

                        const countryCode = dataContext.id;

                        openCountryPanel(countryCode);
                    }
                );
                const wishPointSeries = chart.series.push(
                  am5map.MapPointSeries.new(root,{
                      latitudeField: "latitude",
                      longitudeField: "longitude"
                  })
                );

                wishPointSeries.bullets.push(function (){
                   const container = am5.Container.new(root,{
                       cursorOverStyle:"pointer"
                    });
                    const circle = am5.Circle.new(root,{
                        radius:7,
                        fill:am5.color(0xf296f2),
                        stroke: am5.color(0xffffff),
                        strokeWidth: 2,
                        tooltipText: "❤️ {countryName} · {cityName}"
                    });
                    container.children.push(circle);

                    container.events.on("click", function (event) {
                        const dataItem = event.target.dataItem;
                        if (!dataItem) {
                            return;
                        }
                        const dataContext = dataItem.dataContext;

                        const countryCode = dataContext.countryCode;
                        if (!countryCode) {
                            alert("게시물 데이터 없음");
                            return;
                        }
                        openWishPanel(countryCode);
                    });
                    return am5.Bullet.new(root, {
                        sprite: container
                    });
                });
                $.ajax({
                    url:"/mypage/wishlist/point",
                    type:"GET",
                    dataType: "json",
                    success:function (response){
                        wishPointSeries.data.setAll(response.data);
                    },error:function (){
                        alert("위시리스트 위치 에러");
                    }
                })

                const postPointSeries = chart.series.push(
                    am5map.MapPointSeries.new(root,{
                        latitudeField: "latitude",
                        longitudeField: "longitude"
                    })
                );

                postPointSeries.bullets.push(function (){
                   const container = am5.Container.new(root,{
                       cursorOverStyle:"pointer"
                   });
                   const circle = am5.Circle.new(root,{
                      radius:7,
                       fill:am5.color(0x9454d8),
                       stroke: am5.color(0xffffff),
                       strokeWidth: 2,
                       tooltipText: "📍{countryName} · {cityName}"
                   });
                    container.children.push(circle);

                    container.events.on("click", function (event) {
                        const dataItem = event.target.dataItem;
                        if (!dataItem) {
                            return;
                        }
                        const dataContext = dataItem.dataContext;

                        const countryCode = dataContext.countryCode;
                        if (!countryCode) {
                            alert("게시물 데이터 없음");
                            return;
                        }
                        openCountryPanel(countryCode);
                    });


                    return am5.Bullet.new(root, {
                        sprite: container
                    });
                });
                $.ajax({
                    url:"/mypage/post/point",
                    type:"GET",
                    dataType: "json",
                    success:function (response){
                        postPointSeries.data.setAll(response.data);
                    },error:function (){
                        alert("게시물 위치 에러");
                    }
                })

                chart.animate({
                    key: "rotationX",
                    from: 0,
                    to: 360,
                    duration: 60000,
                    loops: Infinity
                });

                chart.appear(1000, 100);
            });

        }
        $(document).on("click", ".country-ticket.generated", function () {

            const postId = $(this).data("post-id");

            console.log("티켓 클릭 postId:", postId);

            if (!postId) {
                alert("게시물 번호가 없습니다.");
                return;
            }

            openPostDetailModal(postId);
        });


        $(document).on("click", ".country-ticket-menu", function (event) {

            event.stopPropagation();

            const postId = $(this).closest(".country-ticket").data("post-id");

            if (!postId) {
                alert("게시물 번호가 없습니다.");
                return;
            }

            $(".edit-post-btn").addClass("d-none").removeData("post-id");

            $(".delete-post-btn").addClass("d-none").removeData("post-id");

            $(".edit-wishlist-btn").addClass("d-none").removeData("wishlist-id");

            $(".delete-wishlist-btn").addClass("d-none").removeData("wishlist-id");

            $(".edit-post-btn").removeClass("d-none").data("post-id", postId);
            $(".delete-post-btn").removeClass("d-none").data("post-id", postId);

            $("#moreModal").modal("show");
        });
        function adjustVerticalLocationFontSize() {
            const el = document.getElementById("verticalLocation");

            if (el) {
                const textLength = el.textContent.trim().length;

                let fontSize = 1.1;

                if (textLength > 15) fontSize = 1.0;
                if (textLength > 18) fontSize = 0.9;
                if (textLength > 20) fontSize = 0.8;
                if (textLength > 25) fontSize = 0.75;
                if (textLength > 30) fontSize = 0.70;
                el.style.fontSize = fontSize + "rem";
            }
        }
        function openPostDetailModal(postId) {
            sessionStorage.setItem("openPostId", postId);

            $.ajax({
                url: '/post/detail',
                type: 'GET',
                data: { postId: postId },
                dataType: 'html',

                success: function (html) {

                    $('#postDetailModal').remove();

                    $('body').append(html);

                    const $modal = $('#postDetailModal');

                    if (window.lucide) {
                        lucide.createIcons();
                    }
                    adjustVerticalLocationFontSize();
                    if (window.Swiper) {
                        new Swiper($modal.find('.modal-swiper')[0], {
                            pagination: {
                                el: $modal.find('.swiper-pagination')[0],
                                clickable: true
                            }
                        });
                    }

                    $modal.modal('show');
                    $modal.on('hidden.bs.modal', function () {
                        $modal.remove();
                    });

                },
                error: function () {
                    alert('게시물을 불러오지 못했습니다.');
                }
            });
            $(document).on("hidden.bs.modal", "#postDetailModal", function () {
                sessionStorage.removeItem("openPostId");
            });

        }
        $(document).on("click", ".like-btn", function(){

            let $icon = $(this);
            let postId = $icon.data("post-id");

            $.ajax({
                type:"post"
                , url:"/post/like"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 실패");
                    }
                },error: function (){
                    alert("좋아요 에러");
                }
            });

        });
        $(document).on("click", ".unlike-btn", function(){
            let postId = $(this).data("post-id");

            $.ajax({
                type:"DELETE"
                , url:"/post/unlike"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 취소 실패");
                    }
                },error: function (){
                    alert("좋아요 취소 에러");
                }
            });
        });
        $(document).on("click", "#btnCommentSubmit", function () {
            let postId = $("#modalPostId").val();
            let comment = $("#commentInput").val();

            if (!comment || comment.trim() === "") {
                alert("댓글을 입력하세요.");
                return;
            }

            $.ajax({
                type: "post",
                url: "/comment/write",
                data: { postId: postId, comments: comment },
                success: function (response) {
                    if (response.result === "success") {
                        location.reload();
                    } else {
                        alert("댓글 작성 실패!");
                    }
                },
                error: function () {
                    alert("댓글 에러!");
                }
            });
        });
        $(document).on("click", ".comment-delete-btn", function () {
