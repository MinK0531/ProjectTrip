<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK-IN</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body class="bg-gray-50">

<nav class="fixed top-0 left-0 right-0 bg-white border-b border-gray-200 z-50">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-2 cursor-pointer">
                <i data-lucide="map" class="w-8 h-8 text-blue-600"></i>
                <span class="text-xl font-bold">CHECK-IN</span>
            </div>

            <div class="flex items-center gap-1">
                <a href="/home/timeline" class="nav-item flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                    <i data-lucide="home" class="w-6 h-6"></i>
                    <span class="text-xs hidden md:block">홈</span>
                </a>
                <a href="/search/timeline" class="nav-item flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                    <i data-lucide="search" class="w-6 h-6"></i>
                    <span class="text-xs hidden md:block">검색</span>
                </a>

                <a href="/message/list" class="nav-item flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                    <span class="text-xs hidden md:block">메시지</span>
                </a>
                
                <a href="/alarm/timeline" class="nav-item flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span class="text-xs hidden md:block">알람</span>
                </a>
                <button data-toggle="modal" data-target="#createChoiceModal" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
                    <i data-lucide="plus-square" class="w-6 h-6"></i>
                    <span class="text-xs hidden md:block">만들기</span>
                </button>

                <a href="/mypage/map" class="ml-4 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full flex items-center justify-center text-white border-2  cursor-pointer">
                        <img id="navProfileImg"
                             th:src="${session.userProfileImg != null ? session.userProfileImg : '/img/profile.png'}"
                             class="profile-pic profile-sty">
                    </div>
                </a>

                <div th:if="${session.userId != null}">
                    <a href="/user/signout" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
                        <i data-lucide="log-out" class="w-6 h-6"></i>
                        <span class="text-xs hidden md:block">logout</span>
                    </a>
                </div>

            </div>
        </div>
    </div>
</nav>

<!-- 만들기 선택 모달 -->
<div class="modal fade" id="createChoiceModal" tabindex="-1" role="dialog"
     aria-labelledby="createChoiceModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="createChoiceModalLabel">만들기</h5>

                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">

                <button type="button"
                        class="btn btn-light border w-100 mb-3 py-3 text-left"
                        data-dismiss="modal"
                        data-toggle="modal"
                        data-target="#postCreateModal">

                    <div class="d-flex align-items-center">
                        <i data-lucide="image" class="mr-3"></i>

                        <div>
                            <div class="font-weight-bold">
                                게시물 만들기
                            </div>
                            <small class="text-muted">
                                여행 사진과 게시물을 공유해보세요.
                            </small>
                        </div>
                    </div>
                </button>


                <button type="button"
                        class="btn btn-light border w-100 py-3 text-left"
                        data-dismiss="modal"
                        data-toggle="modal"
                        data-target="#wishlistCreateModal">

                    <div class="d-flex align-items-center">
                        <i data-lucide="heart" class="mr-3"></i>

                        <div>
                            <div class="font-weight-bold">
                                위시리스트 만들기
                            </div>
                            <small class="text-muted">
                                가고 싶은 여행지를 저장해보세요.
                            </small>
                        </div>
                    </div>
                </button>

            </div>
        </div>
    </div>
</div>

<div class="modal fade"
     id="postCreateModal"
     tabindex="-1"
     role="dialog"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered post-modal-dialog"
         role="document">

        <div class="modal-content post-modal-content">

            <div class="ticket-wrapper">

                <div class="ticket-main">

                    <div class="ticket-container">

                        <!-- 이미지 업로드 -->
                        <div class="ticket-left-upload">

                            <div class="new-post-header">

                                <div class="ticket-plane-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5v1.5l3.5-1 3.5 1V20.5L13 19v-5.5l8 2.5z"/>
                                    </svg>
                                </div>

                                <span class="new-post-text">
                                    NEW POST
                                </span>

                            </div>


                            <div class="upload-main-content"
                                 id="drop-zone">

                                <input type="file"
                                       id="image-input"
                                       class="d-none"
                                       multiple>

                                <div id="upload-placeholder">

                                    <i data-lucide="image"
                                       class="image-upload-icon"></i>

                                    <p class="upload-text">
                                        사진을 여기에 끌어다 놓으세요
                                    </p>

                                    <button type="button"
                                            class="btn btn-instagram-style"
                                            id="selectImageBtn">
                                        컴퓨터에서 선택
                                    </button>

                                </div>


                                <div id="swiper-wrapper-box"
                                     class="d-none">

                                    <div class="swiper post-swiper">

                                        <div class="swiper-wrapper"
                                             id="imagePreviewWrapper">
                                        </div>

                                        <div class="swiper-pagination"></div>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- 가운데 -->
                        <div class="ticket-center-input">

                            <div class="top-stripe-head">
                                <img src="/img/top-stripe.png"
                                     alt="top-stripe">
                            </div>


                            <label class="ticket-label ">
                                내용
                            </label>

                            <textarea id="contentsInput"
                                      class="ticket-input"
                                      rows="4"
                                      maxlength="1000"
                                      placeholder="여행의 기록을 남겨보세요 (0/1000)"></textarea>


                            <label class="ticket-label">
                                여행한 나라
                            </label>

                            <select id="countrySelect"
                                    class="ticket-input">

                                <option value=""
                                        disabled
                                        selected>
                                    나라를 선택하세요
                                </option>

                            </select>


                            <label class="ticket-label">
                                음악
                            </label>

                            <input type="text"
                                   id="musicInput"
                                   class="ticket-input"
                                   placeholder="추억의 음악을 찾아보세요">

                        </div>

                    </div>

                </div>


                <!-- 오른쪽 티켓 절취선 -->
                <div class="ticket-stub">

                    <button type="button"
                            class="close-ticket"
                            data-dismiss="modal">
                        &times;
                    </button>


                    <p class="stub-title">
                        추천하는 장소
                        <small>(선택)</small>
                    </p>


                    <label class="ticket-label">
                        여행한 도시
                    </label>

                    <select id="cityNameSelect"
                            class="ticket-input"
                            disabled>

                        <option value=""
                                disabled
                                selected>
                            도시명
                        </option>

                    </select>


                    <label class="ticket-label">
                        가게 이름
                    </label>

                    <input type="text"
                           id="placeNameInput"
                           class="ticket-input"
                           placeholder="맛집 / 명소">


                    <label class="ticket-label">
                        분위기
                    </label>

                    <input type="text"
                           id="placeMoodInput"
                           class="ticket-input"
                           placeholder="평화로운, 힙한 등">


                    <button type="button"
                            class="btn-upload-blue"
                            id="uploadBtn">
                        POST NOW
                    </button>

                </div>

            </div>

        </div>
    </div>


    <input type="hidden"
           id="latitude"
           value="0.0">

    <input type="hidden"
           id="longitude"
           value="0.0">

</div>

<div class="modal fade" id="wishlistCreateModal" tabindex="-1" role="dialog"
     aria-labelledby="wishlistCreateModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="wishlistCreateModalLabel">
                    위시리스트 만들기
                </h5>

                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">

                <!-- 여기에 위시리스트 작성 UI -->
                <div class="text-center py-4">
                    <i data-lucide="heart" class="mb-3"
                       style="width:48px;height:48px;"></i>

                    <h5>가고 싶은 곳을 저장해보세요</h5>

                    <p class="text-muted">
                        여행하고 싶은 장소를 위시리스트에 추가하세요.
                    </p>
                </div>

                <button type="button"
                        class="btn btn-primary btn-block"
                        onclick="openWishlistWrite()">
                    위시리스트 작성하기
                </button>

            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<th:block layout:fragment="content"></th:block>
<th:block layout:fragment="script"></th:block>

<script>lucide.createIcons();</script>

<script>
    function openPostWrite() {

        console.log("게시물 작성");
    }

    function openWishlistWrite() {

        console.log("위시리스트 작성");
    }

    lucide.createIcons();
</script>
</body>
</html>
