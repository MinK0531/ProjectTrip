<div class="modal fade" id="postModifyModal" tabindex="-1" role="dialog" aria-hidden="true"
     th:fragment="modifyPostModal">
    <div class="modal-dialog modal-dialog-centered post-modal-dialog" role="document">
        <div class="modal-content post-modal-content">
            <div class="ticket-wrapper">
                <div class="ticket-main">
                    <div class="ticket-container">
                        <div class="ticket-left-upload p-4">
                            <div class="new-post-header">
                                <div class="ticket-plane-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5v1.5l3.5-1 3.5 1V20.5L13 19v-5.5l8 2.5z"/>
                                    </svg>
                                </div>
                                <span class="new-post-text">Modify POST</span>
                            </div>

                            <div class="upload-main-content" id="drop-zone-modify">
                                <input type="file" id="image-input-modify" class="d-none" multiple>

                                <div id="swiper-wrapper-box-modify"
                                     th:classappend="${post.imageList == null or #lists.isEmpty(post.imageList)} ? 'd-none' : ''">
                                    <div class="swiper post-swiper-modify">
                                        <div class="swiper-wrapper" id="imagePreviewWrapperModify">
                                            <div th:each="img : ${post.imageList}"
                                                 class="swiper-slide existing-image-slide"
                                                 th:data-image-id="${img.id}">
                                                <img th:src="${img.imagePath}" alt="post image">
                                                <button type="button" class="remove-existing-image"
                                                        th:data-image-id="${img.id}">&times;</button>
                                            </div>
                                        </div>
                                        <div class="swiper-pagination"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="ticket-center-input">
                            <div class="top-stripe-head">
                                <img src="/img/top-stripe.png" alt="top-stripe">
                            </div>

                            <label class="ticket-label mt-5">내용</label>
                            <textarea id="contentsInputModify" class="ticket-input" rows="4" maxlength="1000"
                                      placeholder="여행의 기록을 남겨보세요 (0/1000)"
                                      th:text="${post.contents}"></textarea>

                            <label class="ticket-label">여행한 나라</label>
                            <select id="countrySelectModify" class="ticket-input"
                                    th:data-selected-id="${post.countryId}">
                                <option value="" disabled selected>나라를 선택하세요</option>
                            </select>

                            <label class="ticket-label">음악</label>
                            <input type="text" id="musicInputModify" class="ticket-input"
                                   placeholder="추억의 음악을 찾아보세요"
                                   th:value="${post.musicUrl}">
                        </div>
                    </div>
                </div>

                <div class="ticket-stub">
                    <div class="d-flex w-100">
                        <div class="col-10"></div>
                        <div class="col-2 d-flex justify-content-end">
                            <button type="button" class="close-ticket" data-dismiss="modal">&times;</button>
                        </div>
                    </div>

                    <p class="stub-title">추천하는 장소 <small>(선택)</small></p>

                    <label class="ticket-label">여행한 도시</label>
                    <select id="cityNameSelectModify" class="ticket-input"
                            th:data-selected-name="${post.cityName}"
                            th:disabled="${post.countryId == null}">
                        <option value="" disabled selected>도시명</option>
                    </select>

                    <label class="ticket-label">가게 이름</label>
                    <input type="text" id="placeNameInputModify" class="ticket-input"
                           placeholder="맛집 / 명소" th:value="${post.placeName}">

                    <label class="ticket-label">분위기</label>
                    <input type="text" id="placeMoodInputModify" class="ticket-input"
                           placeholder="평화로운, 힙한 등" th:value="${post.atmosphere}">

                    <button type="button" class="btn-upload-blue" id="modifyBtn">MODIFY POST</button>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="modifyPostId" th:value="${post.id}">
    <input type="hidden" id="deleteImageIdsModify" value="">

    <script th:inline="javascript">
        $(document).ready(function(){
           let deleteImageIds = [];
           let modifySwiper = null;

           function initSwiper(){
               if(modifySwiper && typeof modifySwiper.destroy === 'function'){
                    modifySwiper.destroy(true,true);
                    modifySwiper = null;
               }

               const swiperEl = document.querySelector('#postModifyModal .post-swiper-modify');

               if(swiperEl){
                   modifySwiper = new Swiper(swiperEl,{
                      slidesPerView : 1,
                       spaceBetween: 0,
                       loop: false,
                       pagination: {
                           el: swiperEl.querySelector('.swiper-pagination'),
                           clickable: true
                       },
                       touchRatio: 1,
                       grabCursor: true
                   });
               }
           }
           if($('#imagePreviewWrapperModify .swiper-slide').length > 0){
               initSwiper();
           }
           $('.remove-existing-image').on("click",function (){
               const imageId = $(this).data("image-id");
               if($('#imagePreviewWrapperModify .swiper-slide').length <= 1){
                   alert("사진은 최소 1장 이상 있어야 합니다.");
                   return;
               }
               if(imageId) {
                   deleteImageIds.push(imageId);
                   $('#deleteImageIdsModify').val(deleteImageIds.join(','));
               }
               $(this).closest('.swiper-slide').remove();

               initSwiper();
           });

           const selectedCountryId  = $('#countrySelectModify').data('selected-id');
           const selectedCityName  = $('#cityNameSelectModify').data('selected-name');

           $.ajax({
              type:'GET',
               url: '/country/list',
               success: function (response) {
                   const $countrySelect = $('#countrySelectModify');
                   response.forEach(function (country) {
                       const isSelected = country.id == selectedCountryId;
                       $countrySelect.append(
                           $('<option>', {
                               value: country.id,
                               text: country.countryNameKo + ' (' + country.countryNameEn + ')',
                               'data-country-code': country.countryCode,
                               selected: isSelected
                           })
                       );
                   });

                   if (selectedCountryId) {
                       loadCities(selectedCityName);
                   }
               }
           });

            $('#countrySelectModify').on('change', function () {
                alert('나라는 수정할 수 없습니다.');
                $(this).val(selectedCountryId);

            });

            function loadCities(targetCityName) {
                const countryCode = $('#countrySelectModify').find(':selected').data('country-code');
                const $citySelect = $('#cityNameSelectModify');
                $citySelect.empty().prop('disabled', false);

                if (!countryCode) return;

                $.ajax({
                    type: 'POST',
                    url: '/city/list',
                    contentType: 'application/json',
                    data: JSON.stringify({ countryCode: countryCode }),
                    success: function (response) {
                        $citySelect.append('<option value="" disabled selected>도시명</option>');
                        response.forEach(function (city) {
                            const isSelected = city === targetCityName;
                            $citySelect.append(
                                $('<option>', {
                                    value: city,
                                    text: city,
                                    selected: isSelected
                                })
                            );
                        });
                    }
                });
            }

            $('#modifyBtn').on("click",function (){
                const postId = $('#modifyPostId').val();
                const contents = $('#contentsInputModify').val();
                const cityName = $('#cityNameSelectModify').val();
                const placeName = $('#placeNameInputModify').val();
                const atmosphere = $('#placeMoodInputModify').val();
                const musicUrl = $('#musicInputModify').val();

                if (!contents) {
                    alert('내용을 입력하세요.');
                    return;
                }

                const formData = new FormData();
                formData.append("postId", postId);
                formData.append("contents", contents);
                formData.append("cityName", cityName);
                formData.append("placeName", placeName);
                formData.append("atmosphere", atmosphere);
                formData.append("musicUrl", musicUrl);
                formData.append("deleteImageIds", deleteImageIds.join(','));

                $.ajax({
                    type:"PUT",
                    url:"/post/modify",
                    data:formData,
                    processData: false,
                    contentType: false,
                    success:function (response){
                       if(response.result === 'success'){
                           location.reload();
                       }else{
                           alert("게시물 수정 실패");
                       }
                    },error:function (){
                       alert("게시물 수정 에러");
                    }
                });
            });

        });

    </script>

</div>
