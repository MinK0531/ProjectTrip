<div class="modal fade" id="postDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 modal-content-fixed">
            <div class="d-flex w-100 h-100">

                <div class="ticket-sidebar">
                    <i data-lucide="plane" class="text-white w-10 h-10 rotate-45"></i>

                    <div class="barcode-deco">
                        <img src="/img/barcodeWW.png" alt="barcode">
                    </div>

                    <div class="vertical-location" id="modalLocationSidebar">대한민국 - JEJU</div>

                    <div class="barcode-deco">
                        <img src="/img/barcodeW.png" alt="barcode">
                    </div>
                </div>

                <div class="img position-relative bg-dark flex-shrink-0">
                    <div class="swiper modal-swiper w-100 h-100">
                        <div class="swiper-wrapper" id="modalImageWrapper"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <div class="flex-grow-1 d-flex flex-column bg-white h-100 min-w-0">
                    <div class="blue flex-shrink-0 line"></div>

                    <div class="modal-detail-header">
                        <div class="d-flex align-items-center">
                            <div class="modal-writer-profile-wrap">
                                <img id="modalWriterProfileImg" src="/img/profile.png" alt="Profile" class="profile-pic profile-sty">
                            </div>

                            <div>
                                <h6 id="modalNickname" class="mb-0 font-weight-bold text-dark small"></h6>
                                <small class="text-muted d-flex align-items-center modal-music-info">
                                    <i data-lucide="music" class="mr-1 text-primary modal-music-icon"></i>
                                    <span id="modalMusic" class="text-truncate modal-music-text">라라랜드 - another day of sun</span>
                                </small>
                            </div>
                        </div>

                        <div id="modalPlaceInfo" class="d-none modal-place-info polygon">
                            <div class="h-100 d-flex flex-column justify-content-center pl-5 pr-3">
                                <div class="d-flex align-items-center">
                                    <i data-lucide="map-pin" class="text-primary mr-1 modal-pin-icon"></i>
                                    <strong id="modalCityName" class="small text-primary text-truncate"></strong>
                                </div>
                                <div id="modalPlaceName" class="text-primary text-truncate ml-3 modal-place-name"></div>
                                <div id="modalAtmosphere" class="text-muted text-truncate ml-3 modal-atmosphere"></div>
                            </div>
                        </div>

                        <button id="closeModal" type="button" class="close-ticket m-2" data-dismiss="modal">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div id="modalCommentList" class="flex-grow-1 overflow-auto p-3 custom-scroll bg-light">
                    </div>

                    <div class="px-3 py-2 border-top bg-white d-flex align-items-center flex-shrink-0">
                        <button type="button" id="modalLikeBtn" class="btn btn-link text-dark p-0 mr-3 text-decoration-none d-flex align-items-center">
                            <i id="modalLikeIcon" class="bi bi-heart h5 mb-0 mr-1 text-danger"></i>
                            <span id="modalLikeCount" class="small font-weight-bold">0</span>
                        </button>
                        <button type="button" class="btn btn-link text-dark p-0 mr-3 text-decoration-none d-flex align-items-center">
                            <i class="bi bi-share h5 mb-0 mr-1"></i>
                            <span class="small font-weight-bold">0</span>
                        </button>
                        <button type="button" class="btn btn-link text-dark p-0 mr-3 text-decoration-none d-flex align-items-center">
                            <i class="bi bi-send h5 mb-0 mr-1"></i>
                            <span class="small font-weight-bold">0</span>
                        </button>
                        <button type="button" class="btn btn-link text-dark p-0 text-decoration-none d-flex align-items-center ml-auto">
                            <i class="bi bi-bookmark h5 mb-0"></i>
                        </button>
                    </div>


                    <div class="p-2 border-top bg-white flex-shrink-0">
                        <div class="d-flex align-items-center">
                            <input type="hidden" id="modalPostId">
                            <div class="modal-input-profile-wrap">
                                <img th:src="${session.userProfileImg != null ? session.userProfileImg : '/img/profile.png'}" alt="Profile" class="profile-pic profile-sty">
                            </div>

                            <div class="flex-grow-1 bg-light border rounded-pill px-3 py-1 d-flex d-flex align-items-center justify-content-center">
                                <input type="text" id="commentInput" placeholder="당신의 흔적을 남겨보세요..." class="col-10 form-control-plaintext form-control-sm p-1 shadow-none modal-comment-input">

                                <div id="replyIndicator" class="col-2 d-none d-flex justify-content-between align-items-center">
                                    <span id="replyTargetName" class="text-primary font-weight-bold reply-target-name"></span>
                                    <button type="button" onclick="cancelReplyMode()" class="btn btn-sm btn-link text-muted p-0 border-0 reply-cancel-btn">취소</button>
                                </div>

                            </div>

                            <button id="btnCommentSubmit" class="btn btn-link text-primary font-weight-bold text-decoration-none m-2  flex-shrink-0 modal-submit-btn">게시</button>
                        </div>
                    </div>

                    <div class="blue flex-shrink-0 line"></div>
                </div>

            </div>
        </div>
    </div>
</div>
