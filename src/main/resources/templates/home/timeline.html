<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{components/default_head}">
<head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
<div layout:fragment="content">
    <main class="max-w-2xl mx-auto px-4 py-20">
        <div class="space-y-6">
            <div th:if="${feedList == null or #lists.isEmpty(feedList)}"
                 class="text-center text-gray-500">
                <i data-lucide="camera-off" class="w-12 h-12 mx-auto mb-4"></i>
                <p>아직 게시물이 없습니다. 첫 여행 기록을 남겨보세요!</p>
            </div>

            <div th:if="${feedList != null and !#lists.isEmpty(feedList)}">

                <div th:each="feed : ${feedList}">


                    <div th:if="${feed.type == 'POST'}"
                         th:with="post=${feed.data}">

                        <div th:replace="~{post/post :: post(post=${post})}">
                        </div>

                    </div>


                    <div th:if="${feed.type == 'WISHLIST'}"
                         th:with="wishlist=${feed.data}">

                        <div th:replace="~{wishlist/wishlist :: wishlist(wishlist=${wishlist})}">
                        </div>

                    </div>

                </div>

            </div>
        </div>
        <div class="modal fade create-choice-modal" id="moreModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body">

                        <button type="button" class="btn-choice edit-post-btn d-none">게시물 수정</button>
                        <button type="button" class="btn-choice delete-post-btn d-none">게시물 삭제</button>

                        <button type="button" class="btn-choice edit-wishlist-btn d-none">위시리스트 수정</button>
                        <button type="button" class="btn-choice delete-wishlist-btn d-none">위시리스트 삭제</button>

                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{post/post_card :: #postDetailModal}"></div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>

        $(".open-post-detail").on("click", function () {
            let postId = $(this).data("post-id");

            $("#modalPostId").val(postId);

            $("#postDetailModal").modal("show");
        });

        document.addEventListener("DOMContentLoaded", function () {

            document.querySelectorAll(".feed-swiper").forEach(function (element) {

                new Swiper(element, {

                    slidesPerView: 1,
                    spaceBetween: 0,
                    loop: false,
                    pagination: {
                        el: element.querySelector(".swiper-pagination"),
                        clickable: true
                    }, touchRatio: 1,
                    grabCursor: true
                });
            });
        });

        $(".delete-wishlist-btn").on("click",function (){
            let wishlistId = $(this).data("wishlist-id");

            $.ajax({
               type:"delete"
                ,url: "/wishlist/remove"
                ,data:{"wishlistId":wishlistId}
                ,success: function (response){
                   if(response.result == "success"){
                       location.reload();
                   }else{
                       alert("위시리스트 삭제 실패");
                   }
                },error:function (){
                   alert("위시리스트 삭제 에러");
                }

            });

        });

        $(".delete-post-btn").on("click",function (){
            let postId = $(this).data("post-id");

            $.ajax({
               type:"delete"
                ,url:"/post/remove"
                ,data:{"postId":postId}
                ,success: function (response){
                   if(response.result =="success"){
                       location.reload();
                   }else {
                       alert("게시물 삭제 실패");
                   }
                },error: function (){
                   alert("게시물 삭제 에러");
                }
            });

        });

        $(".more-btn").on("click",function (){
            let postId = $(this).data("post-id");
            let wishlistId = $(this).data("wishlist-id");
            let type = $(this).data("type");



            $(".edit-post-btn").addClass("d-none").removeData("post-id");
            $(".delete-post-btn").addClass("d-none").removeData("post-id");

            $(".edit-wishlist-btn").addClass("d-none").removeData("wishlist-id");
            $(".delete-wishlist-btn").addClass("d-none").removeData("wishlist-id");

            if(type == "POST"){
                $(".edit-post-btn") .removeClass("d-none") .data("post-id", postId);
                $(".delete-post-btn") .removeClass("d-none") .data("post-id", postId);
            }

            if(type == "WISHLIST"){
                $(".edit-wishlist-btn") .removeClass("d-none") .data("wishlist-id", wishlistId);
                $(".delete-wishlist-btn") .removeClass("d-none") .data("wishlist-id", wishlistId);
            }


            $("#moreModal").modal("show");
        });

        $(".like-btn").on("click",function (){

            let postId = $(this).data("post-id");

            $.ajax({
                type:"post"
                , url:"/post/like"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 실패");
                    }
                },error: function (){
                    alert("좋아요 에러");
                }
            });

        });
        $(".unlike-btn").on("click",function (){
            let postId = $(this).data("post-id");

            $.ajax({
                type:"DELETE"
                , url:"/post/unlike"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 취소 실패");
                    }
                },error: function (){
                    alert("좋아요 취소 에러");
                }
            });
        });
    </script>
</div>

</body>
</html>
