<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{components/default_head}">
<head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
<div layout:fragment="content">
    <main class="max-w-2xl mx-auto px-4 py-20">
        <div class="space-y-6">
            <div th:if="${feedList == null or #lists.isEmpty(feedList)}"
                 class="text-center text-gray-500">
                <i data-lucide="camera-off" class="w-12 h-12 mx-auto mb-4"></i>
                <p>아직 게시물이 없습니다. 첫 여행 기록을 남겨보세요!</p>
            </div>

            <div th:if="${feedList != null and !#lists.isEmpty(feedList)}">

                <div th:each="feed : ${feedList}">


                    <div th:if="${feed.type == 'POST'}"
                         th:with="post=${feed.data}">

                        <div th:replace="~{post/post :: post(post=${post})}">
                        </div>

                    </div>


                    <div th:if="${feed.type == 'WISHLIST'}"
                         th:with="wishlist=${feed.data}">

                        <div th:replace="~{wishlist/wishlist :: wishlist(wishlist=${wishlist})}">
                        </div>

                    </div>

                </div>

            </div>
        </div>
        <div class="modal fade create-choice-modal" id="moreModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body">

                        <button type="button" class="btn-choice edit-post-btn d-none">게시물 수정</button>
                        <button type="button" class="btn-choice delete-post-btn d-none">게시물 삭제</button>

                        <button type="button" class="btn-choice edit-wishlist-btn d-none">위시리스트 수정</button>
                        <button type="button" class="btn-choice delete-wishlist-btn d-none">위시리스트 삭제</button>

                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>


        $(document).on("click", ".comment-delete-btn", function () {

            const commentId = $(this).data("comment-id");

            $.ajax({
                url: "/comment/remove",
                type: "DELETE",
                data: {commentId: commentId},
                success: function (response) {
                    if (response.result === "success") {
                        location.reload();
                    } else {
                        alert("댓글 삭제 실패");
                    }
                }, error: function () {
                    alert("댓글 삭제 에러");
                }
            });
        });
        function adjustVerticalLocationFontSize() {
            const el = document.getElementById("verticalLocation");

            if (el) {
                const textLength = el.textContent.trim().length;

                let fontSize = 1.1;

                if (textLength > 15) fontSize = 1.0;
                if (textLength > 18) fontSize = 0.9;
                if (textLength > 20) fontSize = 0.8;
                if (textLength > 25) fontSize = 0.75;
                if (textLength > 30) fontSize = 0.70;
                el.style.fontSize = fontSize + "rem";
            }
        }

        $(document).on("click", "#btnCommentSubmit", function () {
            let postId = $("#modalPostId").val();
            let comment = $("#commentInput").val();

            if (!comment || comment.trim() === "") {
                alert("댓글을 입력하세요.");
                return;
            }

            $.ajax({
                type: "post",
                url: "/comment/write",
                data: { postId: postId, comments: comment },
                success: function (response) {
                    if (response.result === "success") {
                        location.reload();
                    } else {
                        alert("댓글 작성 실패!");
                    }
                },
                error: function () {
                    alert("댓글 에러!");
                }
            });
        });

        $(".open-post-detail").on("click", function () {

            let postId = $(this).data("post-id");
            sessionStorage.setItem("openPostId", postId);

            $.ajax({
                type: "GET",
                url: "/post/detail",
                data: {postId: postId},
                success: function (response) {

                    $("#postDetailModal").remove();
                    $("body").append(response);
                    $("#postDetailModal").modal("show");
                    lucide.createIcons();

                    adjustVerticalLocationFontSize();

                    const modalSwiper = document.querySelector("#postDetailModal .modal-swiper");

                    if (modalSwiper) {
                        new Swiper(modalSwiper, {
                            slidesPerView: 1,
                            spaceBetween: 0,
                            loop: false,
                            pagination: {
                                el: modalSwiper.querySelector(".swiper-pagination"),
                                clickable: true
                            },
                            touchRatio: 1,
                            grabCursor: true
                        });
                    }
                }, error: function () {
                    alert("게시물을 불러오는데 실패했습니다.");
                }
            });

        });
        $(document).on("hidden.bs.modal", "#postDetailModal", function () {
            sessionStorage.removeItem("openPostId");
        });

        $(document).ready(function () {
            let savedPostId = sessionStorage.getItem("openPostId");
            if (savedPostId) {
                $(`.open-post-detail[data-post-id="${savedPostId}"]`).trigger("click");
            }
        });

        document.addEventListener("DOMContentLoaded", function () {

            document.querySelectorAll(".feed-swiper").forEach(function (element) {

                new Swiper(element, {

                    slidesPerView: 1,
                    spaceBetween: 0,
                    loop: false,
                    pagination: {
                        el: element.querySelector(".swiper-pagination"),
                        clickable: true
                    }, touchRatio: 1,
                    grabCursor: true
                });
            });
        });


        $(".delete-wishlist-btn").on("click",function (){
            let wishlistId = $(this).data("wishlist-id");

            $.ajax({
               type:"delete"
                ,url: "/wishlist/remove"
                ,data:{"wishlistId":wishlistId}
                ,success: function (response){
                   if(response.result == "success"){
                       location.reload();
                   }else{
                       alert("위시리스트 삭제 실패");
                   }
                },error:function (){
                   alert("위시리스트 삭제 에러");
                }

            });

        });

        $(".delete-post-btn").on("click",function (){
            let postId = $(this).data("post-id");

            $.ajax({
               type:"delete"
                ,url:"/post/remove"
                ,data:{"postId":postId}
                ,success: function (response){
                   if(response.result =="success"){
                       location.reload();
                   }else {
                       alert("게시물 삭제 실패");
                   }
                },error: function (){
                   alert("게시물 삭제 에러");
                }
            });

        });

        $(".more-btn").on("click",function (){
            let postId = $(this).data("post-id");
            let wishlistId = $(this).data("wishlist-id");
            let type = $(this).data("type");



            $(".edit-post-btn").addClass("d-none").removeData("post-id");
            $(".delete-post-btn").addClass("d-none").removeData("post-id");

            $(".edit-wishlist-btn").addClass("d-none").removeData("wishlist-id");
            $(".delete-wishlist-btn").addClass("d-none").removeData("wishlist-id");

            if(type == "POST"){
                $(".edit-post-btn") .removeClass("d-none") .data("post-id", postId);
                $(".delete-post-btn") .removeClass("d-none") .data("post-id", postId);
            }

            if(type == "WISHLIST"){
                $(".edit-wishlist-btn") .removeClass("d-none") .data("wishlist-id", wishlistId);
                $(".delete-wishlist-btn") .removeClass("d-none") .data("wishlist-id", wishlistId);
            }


            $("#moreModal").modal("show");
        });

        $(document).on("click", ".like-btn", function(){

            let $icon = $(this);
            let postId = $icon.data("post-id");

            $.ajax({
                type:"post"
                , url:"/post/like"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 실패");
                    }
                },error: function (){
                    alert("좋아요 에러");
                }
            });

        });
        $(document).on("click", ".unlike-btn", function(){
            let postId = $(this).data("post-id");

            $.ajax({
                type:"DELETE"
                , url:"/post/unlike"
                , data:{"postId":postId}
                , success:function (response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("좋아요 취소 실패");
                    }
                },error: function (){
                    alert("좋아요 취소 에러");
                }
            });
        });

        $(document).on("click", ".edit-post-btn", function () {
            let postId = $(this).data("post-id");

            $("#moreModal").modal("hide");

            $.ajax({
                type: "GET",
                url: "/post/modify-modal",
                data: { postId: postId },
                success: function (response) {
                    $("#postModifyModal").remove();
                    $("body").append(response);

                    $("#modifyPostId").val(postId);
                    $("#postModifyModal").modal("show");

                    lucide.createIcons();
                },
                error: function () {
                    alert("게시물 정보를 불러오는데 실패했습니다.");
                }
            });
        });
    </script>
</div>

</body>
</html>
